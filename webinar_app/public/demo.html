<title>Human in the Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #F4F4F5;
  --surface: #FFFFFF;
  --surface-2: #EBEBED;
  --navy: #18306A;
  --blue: #3060D8;
  --blue-pale: #E7EDFB;
  --green: #0B9B6B;
  --amber: #B45309;
  --amber-pale: #FFF8ED;
  --text: #1B2C4E;
  --muted: #64789E;
  --border: #E2E2E6;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113;
    --surface: #1C1C1F;
    --surface-2: #252528;
    --text: #E8E8EC;
    --muted: #8E8E9A;
    --border: #2E2E34;
    --blue-pale: #1A2540;
    --amber-pale: #231A0A;
  }
}
:root[data-theme="dark"] {
  --bg: #111113;
  --surface: #1C1C1F;
  --surface-2: #252528;
  --text: #E8E8EC;
  --muted: #8E8E9A;
  --border: #2E2E34;
  --blue-pale: #1A2540;
  --amber-pale: #231A0A;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* ── Header ── */
.hdr {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.hdr-eyebrow {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.hdr-term {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--navy);
  padding: 2px 9px;
  background: var(--blue-pale);
  border-radius: 4px;
}
.pips {
  display: flex;
  gap: 5px;
  margin-left: auto;
  align-items: center;
}
.pip {
  width: 24px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  transition: background 0.3s;
}
.pip.done { background: var(--green); }
.pip.active { background: var(--blue); }

/* ── Main ── */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 55fr 45fr;
  min-height: 0;
  overflow: hidden;
}
.pane {
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.pane-fac { border-right: 1px solid var(--border); }
.pane-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.pane-label i {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
  font-style: normal;
}
.pane-fac .pane-label i { background: var(--amber); }
.pane-par .pane-label i { background: var(--blue); }
.pane-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: stagein 0.22s ease;
}
@keyframes stagein {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Chips ── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--blue-pale);
  color: var(--blue);
  padding: 3px 8px;
  border-radius: 4px;
  align-self: flex-start;
}
.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 1.4s infinite ease-in-out;
  flex-shrink: 0;
}
@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:0.35; }
}
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: 0.04em;
}

/* ── Term intro ── */
.term-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 30px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.1;
  text-wrap: balance;
}
.concept-text {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text);
  max-width: 54ch;
}
.key-q {
  font-size: 13px;
  line-height: 1.6;
  color: var(--blue);
  font-style: italic;
  padding: 10px 14px;
  border-left: 3px solid var(--blue);
  background: var(--blue-pale);
  border-radius: 0 6px 6px 0;
  max-width: 52ch;
}

/* ── Vote options ── */
.vote-prompt {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.5;
  text-wrap: balance;
}
.vote-opts { display: flex; flex-direction: column; gap: 7px; }
.opt {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
}
.opt-ltr {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  font-family: 'Space Grotesk', sans-serif;
}
.closed-note {
  font-size: 11.5px;
  color: var(--muted);
  font-style: italic;
}

/* ── Results ── */
.results { display: flex; flex-direction: column; gap: 10px; }
.result-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 3px;
}
.result-text {
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.4;
}
.result-pct {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  grid-row: 1 / 3;
  grid-column: 2;
  align-self: center;
  padding-left: 10px;
}
.result-bar-track {
  height: 5px;
  background: var(--surface-2);
  border-radius: 3px;
  overflow: hidden;
  grid-column: 1;
}
.result-bar-fill {
  height: 100%;
  border-radius: 3px;
  width: 0;
  transition: width 0.75s cubic-bezier(0.16,1,0.3,1);
}
.result-lens {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  font-variant: small-caps;
  font-family: 'Space Grotesk', sans-serif;
  grid-column: 1;
}

/* ── Scenario ── */
.scenario-box {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 13px 16px;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--text);
}

/* ── Lightning ── */
.binary-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.binary-card {
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 14px 12px;
  text-align: center;
  background: var(--surface);
}
.binary-ltr {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--blue);
  display: block;
  margin-bottom: 6px;
}
.binary-desc { font-size: 11.5px; line-height: 1.5; color: var(--muted); }
.binary-bar {
  height: 44px;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  border: 1.5px solid var(--border);
}
.bseg {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: white;
}

/* ── Facilitator amber callout ── */
.fac-note {
  background: var(--amber-pale);
  border: 1px solid #FDE68A;
  border-radius: 8px;
  padding: 11px 14px;
}
.fac-note-lbl {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 8px;
}
.fac-note-item {
  font-size: 12px;
  color: var(--text);
  line-height: 1.55;
  padding-left: 10px;
  border-left: 2px solid #FCD34D;
  margin-top: 7px;
}
.fac-note-item:first-of-type { margin-top: 0; }

/* ── Summary grid ── */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.summary-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.summary-card-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 4px;
  margin-bottom: 4px;
}
.summary-row-text { font-size: 11px; color: var(--text); line-height: 1.35; flex: 1; }
.summary-row-pct {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

/* ── Phone frame ── */
.phone-wrap { display: flex; justify-content: center; }
.phone {
  width: 210px;
  background: #1A1A1C;
  border-radius: 30px;
  padding: 18px 10px 22px;
  box-shadow: 0 24px 56px rgba(0,0,0,0.28), inset 0 0 0 1px rgba(255,255,255,0.07);
  flex-shrink: 0;
}
.phone-notch {
  width: 56px;
  height: 5px;
  background: #2C2C2F;
  border-radius: 3px;
  margin: 0 auto 14px;
}
.phone-screen {
  background: var(--surface);
  border-radius: 18px;
  overflow: hidden;
  min-height: 340px;
  display: flex;
  flex-direction: column;
}
.pscr-top {
  background: var(--navy);
  padding: 9px 12px 7px;
}
.pscr-ttl {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 9.5px;
  font-weight: 700;
  color: rgba(255,255,255,0.85);
  letter-spacing: 0.05em;
}
.pscr-body {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.p-concept { font-size: 9.5px; line-height: 1.6; color: var(--text); }
.p-keyq {
  font-size: 9px;
  color: var(--blue);
  font-style: italic;
  padding: 5px 7px;
  border-left: 2px solid var(--blue);
  background: var(--blue-pale);
  border-radius: 0 4px 4px 0;
  line-height: 1.5;
}
.p-prompt {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.45;
}
.p-opt {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  padding: 6px 8px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 9.5px;
  line-height: 1.4;
  color: var(--text);
}
.p-opt.sel { border-color: var(--blue); background: var(--blue-pale); }
.p-ltr {
  width: 15px; height: 15px;
  border-radius: 50%;
  font-size: 8.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-family: 'Space Grotesk', sans-serif;
  background: var(--surface-2);
  color: var(--muted);
}
.p-opt.sel .p-ltr { background: var(--blue); color: white; }
.p-btn {
  background: var(--blue);
  color: white;
  border: none;
  border-radius: 6px;
  padding: 9px;
  width: 100%;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: default;
  margin-top: 2px;
}

/* ── Footer nav ── */
.nav {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.nav-name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.nav-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.nav-btns { display: flex; gap: 8px; }
.btn {
  padding: 7px 16px;
  border-radius: 7px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: border-color 0.15s, color 0.15s;
}
.btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: white; }
.btn.primary:hover:not(:disabled) { opacity: 0.88; color: white; }

@media (max-width: 680px) {
  .main { grid-template-columns: 1fr; }
  .pane-fac { border-right: none; border-bottom: 1px solid var(--border); }
  .summary-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .pane-content { animation: none; }
  .result-bar-fill { transition: none; }
}

function opts(arr) {
  return arr.map(o=>`<div class="opt"><span class="opt-ltr">${o.ltr}</span>${o.text}</div>`).join('');
}

function pOpts(arr, selIdx) {
  return arr.map((o,i)=>`<div class="p-opt${i===selIdx?' sel':''}"><span class="p-ltr">${o.ltr}</span>${o.text.slice(0,58)}…</div>`).join('');
}

function bars(rows) {
  return rows.map(r=>`
    <div class="result-row">
      <div class="result-text">${r.text}</div>
      <div class="result-pct">${r.pct}%</div>
      <div class="result-bar-track"><div class="result-bar-fill" style="background:${r.col}" data-w="${r.pct}"></div></div>
      <div class="result-lens">${r.lens}</div>
    </div>`).join('');
}

function miniBars(rows) {
  return rows.map(r=>`
    <div class="summary-row">
      <span class="summary-row-text">${r.text}</span>
      <span class="summary-row-pct">${r.pct}%</span>
    </div>`).join('');
}

              <div style="width:20px;height:20px;border-radius:50%;background:${i===3?'var(--surface-2)':'var(--blue)'};border:1.5px solid ${i===3?'var(--border)':'var(--blue)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
                <span style="font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;color:${i===3?'var(--muted)':'white'}">${i===3?'…':i+1}</span>
              </div>
              <span style="font-size:11.5px;color:${i===3?'var(--muted)':'var(--text)'}${i===3?';font-style:italic':''}">${s}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="fac-note">
        <div class="fac-note-lbl">Note for facilitators</div>
        <div class="fac-note-item">This demo covers only the Human in the Loop term — the steps above are not included in the 10-minute session.</div>
        <div class="fac-note-item">A full session covering 3 terms typically runs 45–60 minutes.</div>
      </div>`,
    par:()=>`
      <div class="phone-wrap"><div class="phone">
        <div class="phone-notch"></div>
        <div class="phone-screen">
          <div class="pscr-top"><div class="pscr-ttl">Vote — next term</div></div>
          <div class="pscr-body">
            <div class="p-prompt">Which term would you like to explore next?</div>
            ${[
              {name:'Validation', sel:true},
              {name:'Hallucinations', sel:false},
              {name:'Bias', sel:false},
              {name:'AI Governance', sel:false},
              {name:'Performance', sel:false},
            ].map((t,i)=>`
              <div class="p-opt${t.sel?' sel':''}">
                <span class="p-ltr${t.sel?' sel':''}" style="${t.sel?'background:var(--blue);color:white':''}"> </span>
                <span style="font-size:9.5px">${t.name}</span>
              </div>`).join('')}
            <button class="p-btn">Submit vote</button>
          </div>
        </div>
      </div></div>`,
  },
];

let cur = 0;

function render() {
  const s = stages[cur];
  document.getElementById('pips').innerHTML = stages.map((_,i)=>
    `<div class="pip ${i<cur?'done':i===cur?'active':''}"></div>`).join('');
  document.getElementById('fac').innerHTML = s.fac() + QR_BLOCK;
  document.getElementById('par').innerHTML = s.par();
  document.getElementById('nav-name').textContent = s.name;
  document.getElementById('nav-sub').textContent = s.sub;
  document.getElementById('btn-prev').disabled = cur === 0;
  const nxt = document.getElementById('btn-next');
  nxt.disabled = cur === stages.length - 1;
  nxt.textContent = cur === stages.length - 1 ? 'Done' : 'Next →';
  if (s.onEnter) s.onEnter();
}

function go(d) {
  const n = cur + d;
  if (n < 0 || n >= stages.length) return;
  cur = n;
  render();
}

render();
</script>
